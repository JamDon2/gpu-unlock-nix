name: Nix Build Check

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build
        run: |
          nix flake check
          nix build --no-link -L .#module .#firmware
